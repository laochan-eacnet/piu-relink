# Unified phoenixtools configuration
# The deployed file lives beside piu.exe. tools/mkgame.sh appends native runtime
# sections to this hook template; the hook also searches beside its module.

[offline]
# International, Korea, China, Latin America, Japan, Indonesia, Thailand,
# Philippines, Europe, MiddleEast, USA; numeric slots 0 through 10 also work.
region = International
hold_lock_screen = false
verbose = false

[gameplay]
# Offline guest access only; these settings grant no online entitlements.
unlock_all_songs = true
unlock_all_charts = true
guest_full_mode = true

[catalog]
# Replace the ordinary NX-NXA channel (enum 12), not an additional/event slot.
# Membership uses either source/display song ID, without changing song metadata.
# Add CHANNEL_CUSTOM to complete per-locale CHANNEL.TXT overlays; see README.
custom_channel = false
# Inclusive decimal or 0x-prefixed IDs; this default avoids reserved ID masks.
custom_id_min = 0x7F00
custom_id_max = 0x7FFF

[input]
# true exposes only synthetic 0d2f:1010/1020 devices.
# false forwards Phoenix's libusb calls to the real 32-bit libusb libraries.
virtual_lxio = true

# Independent of virtual_lxio. false preserves the original serial-reader path.
# true reads P1 card1.txt / P2 card2.txt beside the loaded INI on each NEW press.
# Supply your own UID/account; no startup scan, generated UID, or account creation.
# Files: 2-34 ASCII hex digits/even, surrounding whitespace/CRLF allowed, max256 bytes.
# Missing/invalid files clear that player's pending scan and log only on a press.
# Release before retrying; holding/repeated key-down events do not rescan.
# Enabled mode bypasses real-reader consumption, not enumeration/polling.
virtual_card_reader = false

# X11 keysym names. Every active binding must resolve to a distinct keycode.
upper_left = Q
upper_right = E
center = S
lower_left = Z
lower_right = C
p2_upper_left = U
p2_upper_right = O
p2_center = K
p2_lower_left = M
p2_lower_right = period
service = F1
test = F2
coin1 = 5
# These two bindings are inactive (including validation) when emulation is false.
card1 = F3
card2 = F4

[paths]
# Plain extracted data remains read-only; an empty overlay disables shadowing.
plain_root = /home/geeki/piuxx/phoenix-2024/data
overlay_root =
# Relative paths are resolved from the directory containing this INI file.
runtime_dir = runtime
virtual_disk = runtime/virtual-sda.img

[server]
# Empty values block HTTP(S), DNS and raw TCP. Opt in only to a private plain-HTTP
# base, e.g. http://192.168.1.42:8080 or http://127.0.0.1:8080.
# localhost and numeric 10/8, 172.16/12, 192.168/16 IPv4 are accepted; public
# addresses, arbitrary hostnames, malformed IPv4 and HTTPS are rejected.
# Original paths/queries are preserved; optional base path prefixes are appended.
# api_base routes country/IP/diagnostics; cdn_base separately routes requests to
# xx-cdn.piugame.com/2023/. Empty/invalid matching bases block that route.
# The updater remains disabled. HTTP connects only to configured addresses/ports.
# With api_base enabled, isolated DNS uses its address and game TCP :50400 routes
# to that address on game_port below (default :15040).
# This also leaves the game's 64-byte packet trailer untransformed for the
# private server only; RC4, magic/digest checks and 16-byte packets are unchanged.
# Empty/invalid api_base (or cdn_base alone) installs no trailer-transform patches.
# HTTP success alone does not establish an online game session.
api_base =
cdn_base =
# Raw game TCP listener port, 1..65535; must match the server's --game-port.
game_port = 15040
